<title>Signals Trader568VN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Roboto+Condensed:wght@400;500;700&display=swap">
<style>
/* Layout: terminal nền đen kiểu Bloomberg. Thanh lệnh màu hổ phách / chart (giá + các panel chỉ báo) bên trái / các cột chỉ báo tín hiệu xếp liền kề bên phải. Một giao diện tối duy nhất. */
:root{
  color-scheme:dark;
  --bg:#000000; --panel:#0b0b0c; --panel2:#151517; --line:#2a2a2e; --grid:#1a1a1d; --fg:#e8e6e1; --muted:#8b8a86;
  --amber:#ffa630; --amber-ink:#000000; --buy:#3ddc84; --sell:#ff4d4d; --warn:#ffc94d; --vol:#2f7bff;
  --i1:#4fa3ff; --i2:#c58bff; --i3:#ff8a3d; --i4:#3fd6c9; --i5:#f5d142; --i6:#ff5c8a; --i7:#7dd87d; --i8:#6fa8ff; --i9:#e08cff; --i10:#ffb36b; --i11:#4fe0b0; --i12:#ff7f6b; --i13:#b7c4ff;
  --s1:#ffa630; --s2:#4fd1ff; --s3:#ff6fd8; --s4:#b6f36a; --s5:#c9c9c9;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace; --cond:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px}
@media (max-width:600px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .up{color:var(--buy)} .down{color:var(--sell)} .amb{color:var(--amber)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--amber);outline-offset:1px}
.lbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;color:var(--amber)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--bg);color:var(--fg);padding:6px 10px;border:1px solid var(--line)}
.brand{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.03em;white-space:nowrap;color:var(--amber);text-shadow:0 0 .5px var(--amber)}
.sketch{font-family:var(--cond);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);color:var(--muted);padding:1px 6px}
.search{position:relative;flex:1;min-width:220px;max-width:440px}
.search input{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:5px 10px;font-size:12px;text-transform:uppercase}
.search input::placeholder{color:var(--muted);text-transform:none}
.results{position:absolute;z-index:30;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--amber);max-height:320px;overflow:auto;color:var(--fg)}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.res:hover,.res:focus-visible{background:var(--panel2)}
.res b{color:var(--amber);font-weight:500}
.res small{color:var(--muted);grid-column:1;font-family:var(--cond);font-size:12px}
.res em{font-style:normal;font-size:10.5px;color:var(--muted);grid-row:1/3;grid-column:2;align-self:center}
select.contract{background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:5px 8px;font-size:12px}
.clock{margin-left:auto;font-weight:500;white-space:nowrap;color:var(--fg)}
.clock small{color:var(--muted);font-weight:400;margin-left:6px}

.picker{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;padding:5px 8px;background:var(--panel);border:1px solid var(--line)}
.ichip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:3px 9px;cursor:pointer;font-size:11.5px}
.ichip i{width:8px;height:8px}
.ichip[aria-pressed="true"]{border-color:var(--amber)}
.ichip[aria-pressed="false"]{color:var(--muted)}

.term{display:flex;gap:0;margin-top:6px;height:max(660px,calc(100vh - 130px))}
.wl{flex:0 0 232px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);margin-right:6px;min-width:0;overflow:hidden}
.wlhd{display:flex;align-items:baseline;justify-content:space-between;padding:8px 10px 6px;border-bottom:1px solid var(--line)}
.wlhd span{font-family:var(--cond);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--amber)}
.wlhd em{font-style:normal;font-size:10px;color:var(--muted)}
.wlcol{display:flex;justify-content:space-between;padding:4px 10px;font-family:var(--cond);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--grid)}
#wlist{flex:1;overflow-y:auto}
.wrow{position:relative;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--grid);cursor:pointer;border-left:2px solid transparent}
.wrow:hover{background:#111114}.wrow.on{background:#16161b;border-left-color:var(--amber)}
.wico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:10px;color:#000;grid-row:span 2}
.wtk{font-weight:600;font-size:12.5px;color:var(--fg)}.wnm{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpx{text-align:right;font-size:12.5px}@keyframes flu{from{background:rgba(61,220,132,.35)}to{background:transparent}}@keyframes fld{from{background:rgba(255,77,77,.35)}to{background:transparent}}.fl-up{animation:flu 1.6s ease-out}.fl-dn{animation:fld 1.6s ease-out}
.wvol{font-size:10.5px;color:var(--muted)}.wch{text-align:right;font-size:10.5px;white-space:nowrap}
.wx{position:absolute;left:1px;top:1px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:2px;display:none}.wrow:hover .wx{display:block}.wx:hover{color:var(--sell)}
.wlft{padding:8px 10px;font-size:12px;color:var(--amber);border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-family:var(--cond);font-weight:700;letter-spacing:.04em}.wlft:hover{background:#111114}
.wladd{border-top:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;max-height:240px}
.wladd input{background:var(--bg);border:1px solid var(--line);padding:5px 8px;color:var(--amber);font-size:12px;text-transform:uppercase}.wladd input::placeholder{text-transform:none;color:var(--muted)}
#wlres{overflow-y:auto}#wlres button{display:flex;justify-content:space-between;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--grid);padding:5px 4px;color:var(--fg);cursor:pointer;font-size:11.5px;text-align:left}#wlres button:hover{background:#16161b}#wlres b{white-space:nowrap}#wlres em{font-style:normal;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartbox{flex:1 1 auto;min-width:420px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line)}
.chartbox.full{position:fixed!important;inset:0!important;z-index:900;width:auto!important;height:auto!important;min-width:0!important;max-width:none!important;flex:none!important;margin:0}
.chartbox.full .chartwrap{flex:1 1 auto}
.tvbar{display:flex;align-items:center;gap:2px;padding:3px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative}
.tvbar .sym{color:var(--amber);font-weight:500;padding:3px 8px 3px 2px;border-right:1px solid var(--line);margin-right:4px}
.tvbar button{background:none;border:0;padding:3px 6px;cursor:pointer;color:var(--muted);font-size:11.5px}
.tvbar button.on{background:var(--amber);color:var(--amber-ink)}
.tvbar .sep{width:1px;height:16px;background:var(--line);margin:0 4px}
.tvbar .menu-btn{color:var(--fg);border:1px solid var(--line)}
.tvbar .menu-btn[aria-expanded="true"]{border-color:var(--amber);color:var(--amber)}
.ohlc{margin-left:auto;font-size:11px;color:var(--muted);padding-right:4px}
#indMenu{min-width:340px}
.menu{position:absolute;z-index:25;top:calc(100% + 2px);background:var(--panel);border:1px solid var(--amber);min-width:280px;padding:6px 0;box-shadow:0 10px 30px rgb(0 0 0 / .6)}
.menu h4{margin:6px 12px 4px;font-family:var(--cond);font-weight:500;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--amber)}
.menu label{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;font-size:12px}
.menu label:hover{background:var(--panel2)}
.menu label small{margin-left:auto;color:var(--muted);font-family:var(--cond)}
.menu input[type=checkbox]{accent-color:var(--amber)}
.menu .sw{width:10px;height:10px;display:inline-block}
.ctype{display:inline-flex;border:1px solid var(--line);margin-right:4px}.ctype button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:2px 8px;cursor:pointer}.ctype button.on{background:var(--amber);color:var(--amber-ink);font-weight:700}
.icobtn{background:none;border:1px solid transparent;padding:2px 3px;cursor:pointer;display:inline-flex;align-items:center;opacity:.3;margin-left:2px}.tvbar .icobtn.on,.tvbar .icobtn{color:inherit}.tvbar .icobtn.on{opacity:1;border-color:var(--line);background:#111}.tvbar .icobtn:not(.on){background:none}.icobtn:hover{opacity:1}
.menu .crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;font-size:12px}
.menu input[type=color]{width:40px;height:22px;border:1px solid var(--line);background:none;padding:0}
.menu .hint{padding:4px 12px 2px;font-size:11px;color:var(--muted);font-family:var(--cond);max-width:300px}
.menu .reset{margin:6px 12px 2px;background:var(--panel2);border:1px solid var(--line);padding:3px 8px;cursor:pointer;font-size:11px}
.chartwrap{position:relative;flex:1;background:var(--bg);min-height:300px}
canvas{display:block;width:100%;height:100%}
.panehdr{position:absolute;left:8px;display:flex;align-items:center;gap:8px;font-size:11px;background:rgb(0 0 0 / .6);padding:1px 4px}
.panehdr b{font-weight:500}
.panehdr button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 3px;font-size:13px;line-height:1}
.panehdr button:hover{color:var(--sell)}

.cols{display:flex;gap:0;overflow-x:auto;flex:0 1 auto;min-width:0}
.col{flex:0 0 420px;min-width:300px;max-width:none;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);min-height:0}
.col-h{padding:6px 8px;background:var(--panel2);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:1px 8px;align-items:center;border-top:2px solid var(--c)}
.col-h i{width:8px;height:8px;background:var(--c)}
.col-h h3{margin:0;font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.col-h small{grid-column:2;color:var(--muted);font-size:10.5px}
.col-h .x{grid-row:1/3;grid-column:3;background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;padding:2px 6px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.strip div{padding:6px 8px;border-right:1px solid var(--grid)}
.strip div:last-child{border-right:0}
.strip .v{font-size:15px;margin-top:2px}
.sizer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.sizer input{width:70px;background:var(--bg);border:1px solid var(--line);padding:2px 5px;font-size:11.5px;color:var(--amber)}
.ctabs{display:flex;border-bottom:1px solid var(--line)}
.ctabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:6px 4px;cursor:pointer;color:var(--muted);font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.ctabs button[aria-selected="true"]{color:var(--amber);border-color:var(--amber)}
.cbody{flex:1;overflow:auto;min-height:0;min-width:0}
.rank{flex:1 1 auto;display:flex;flex-direction:column;background:#0c0c10;min-height:0}.rkw{flex:1;overflow:auto;min-height:0}
.rank-h{display:flex;flex-direction:column;gap:2px;padding:9px 12px 8px;font-family:var(--cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:14px;color:var(--amber);position:sticky;top:0;background:var(--panel2);border-top:2px solid var(--amber);border-bottom:1px solid var(--line);z-index:2}
.rank-h small{font-weight:400;text-transform:none;letter-spacing:.01em;color:var(--muted);font-size:12px}
.rkt{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--cond);font-size:13px}
.rkt th{position:sticky;top:0;z-index:1;background:#0c0c10;font-family:var(--cond);font-weight:500;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.rkt td{padding:7px 6px;border-bottom:1px solid #1a1a20;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.rkt .r{text-align:right}.rkt tbody tr{cursor:pointer}.rkt tbody tr:hover td{background:#15151b}
.rkt tr.cur td{background:#1a1712}.rkt tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--amber)}
.rkt .nm{font-weight:700;letter-spacing:.02em;white-space:normal}.rkt td:first-child{text-overflow:clip;padding-left:10px}.rkt .go{padding:0}.rkt .nm i{display:inline-block;width:7px;height:7px;margin-right:7px;vertical-align:1px}
.rkt .sub{display:block;color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:2px}.rkt td.num{font-family:var(--mono);font-size:12.5px}
.rkt .go{color:var(--muted);text-align:center}.rkt tbody tr:hover .go{color:var(--amber)}
.col.ov{border-top:0}.cbody th,.cbody td{padding-left:5px;padding-right:5px}
.col-h .back{grid-row:1/3;grid-column:3;background:none;border:1px solid var(--line);cursor:pointer;color:var(--fg);font-family:var(--cond);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px}.col-h .back:hover{border-color:var(--amber);color:var(--amber)}
:root[data-role="view"] .top .brand{color:#fff;text-shadow:none}
.ptabs{display:inline-flex;border:1px solid var(--line)}.ptabs button{background:none;border:0;border-right:1px solid var(--line);color:var(--muted);font-family:var(--cond);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:5px 12px;cursor:pointer}.ptabs button:last-child{border-right:0}.ptabs button[aria-selected="true"]{background:var(--amber);color:var(--amber-ink)}
body[data-page="eval"] .picker,body[data-page="eval"] .term,body[data-page="eval"] #gutH,body[data-page="eval"] .notes{display:none}
body:not([data-page="eval"]) #cmpsec{display:none}
.cmpsym{display:inline-flex;flex-wrap:wrap;gap:4px}.cmpsym button{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--cond);font-size:12px;padding:3px 8px;cursor:pointer}.cmpsym button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.logic{background:var(--panel2);border-bottom:1px solid var(--line);padding:8px 10px;line-height:1.55;font-family:var(--cond);font-size:13px}
.logic h4{margin:8px 0 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--amber);font-weight:500}
.logic h4:first-child{margin-top:0}
.logic ul{margin:0;padding-left:16px}
.logic .note{margin-top:6px;font-size:11.5px;color:var(--muted)}
.noaccess{padding:10px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:rgba(255,77,77,.06)}
.logicbtn{background:none;border:0;padding:6px 8px;cursor:pointer;color:var(--c);font-size:11.5px;text-align:left;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;width:100%}

.pill{display:inline-block;font-family:var(--cond);font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 6px;text-transform:uppercase;white-space:nowrap}
.p-buy{color:var(--bg);background:var(--buy)}
.p-sell{color:var(--bg);background:var(--sell)}
.p-pend{color:var(--warn);border:1px solid var(--warn)}
.p-act{color:var(--i1);border:1px solid var(--i1)}
.p-tp,.p-ok{color:var(--buy);border:1px solid var(--buy)}
.p-sl,.p-no{color:var(--sell);border:1px solid var(--sell)}
.p-wait{color:var(--muted);border:1px solid var(--line)}

.sig{padding:8px 10px;border-bottom:1px solid var(--grid)}
.sig .t1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sig .t1 .tm{margin-left:auto;font-size:11px;color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:12px}
.lv span{display:block;font-family:var(--cond);font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em}
.sig .ft{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;gap:8px;flex-wrap:wrap}
.sig a{color:var(--amber);text-decoration:none}

table{width:100%;border-collapse:collapse;font-size:11px}
th{font-family:var(--cond);font-weight:500;text-align:left;color:var(--amber);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td{padding:5px 7px;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:nth-child(even) td{background:#08080a}
.r{text-align:right}

.ev{padding:8px 10px;display:flex;flex-direction:column;gap:9px}
.ev .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.ev .row input,.ev .row select{background:var(--bg);border:1px solid var(--line);padding:2px 5px;font-size:11.5px;width:110px;color:var(--amber)}
.verdict{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.obj{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-family:var(--cond);font-size:13px}
.obj .meta{grid-column:1/3;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.meter{grid-column:1/3;height:4px;background:var(--grid)}
.meter b{display:block;height:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--panel);padding:5px 7px}
.stats .v{font-size:13px}
.eq{width:100%;height:70px;display:block;background:var(--bg)}
.addcol{flex:0 0 120px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);text-align:center;padding:12px;font-size:11.5px;background:none;cursor:pointer}

.verbar{padding:6px 10px;border-bottom:1px solid var(--grid);font-size:11px;color:var(--muted)}.verbar select{background:var(--bg);border:1px solid var(--line);color:var(--amber);font-size:11px;padding:2px 4px;margin-left:6px}
.warm{padding:6px 10px;font-size:11px;color:var(--warn,#f0b429);border-bottom:1px solid var(--grid)}
.prm{display:grid;gap:4px;margin:4px 0 8px}.prm label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.prm input,.prm select{width:68px;background:var(--bg);border:1px solid var(--line);color:var(--amber);font-size:11.5px;padding:2px 5px;text-align:right}.prm input:disabled,.prm select:disabled{color:var(--fg);opacity:.75}
.prmact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.prmact button{border:1px solid var(--line);background:none;color:var(--fg);font-size:11px;padding:4px 8px;cursor:pointer}.prmact .savep{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}
.cmpsec{margin-top:6px;background:var(--panel);border:1px solid var(--line);padding:10px 14px}
.cmphd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:11.5px}
.cmphd h2{font-family:var(--cond);font-size:16px;text-transform:uppercase;letter-spacing:.07em;color:var(--amber);margin:0;font-weight:700}
